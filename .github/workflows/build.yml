name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: "Existing release tag to attach macOS/Windows artifacts to (e.g. v1.0.0). Leave empty to skip."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps (eframe / egui)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev pkg-config \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test
        run: cargo test --locked

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo release build
        run: cargo build --release --locked
      - name: Stage exe
        shell: pwsh
        run: Copy-Item target/release/cs2-settings.exe CS2Settings.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CS2Settings-windows
          path: CS2Settings.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: CS2Settings.exe
          generate_release_notes: true
      - name: Upload exe to existing release
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.upload_to_release }}" CS2Settings.exe --clobber

  build-macos-intel:
    needs: test
    # macos-13 retired Dec 2025; macos-15-intel is the current x86_64 hosted runner
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Verify Intel host / target
        run: |
          uname -m
          rustc -vV
          echo "Building for x86_64-apple-darwin"
      - name: Cargo release build (Intel)
        run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Bundle .app, zip, and dmg
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            export APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            export APP_VERSION="1.1.0"
          fi
          # Point bundle script at the target-triple binary
          ./scripts/bundle_app.sh "$PWD/dist/CS2 Settings.app"
          # Confirm Mach-O arch
          lipo -info "dist/CS2 Settings.app/Contents/MacOS/cs2-settings" || true
          file "dist/CS2 Settings.app/Contents/MacOS/cs2-settings" || true

          # ZIP of the .app (Finder-friendly)
          ditto -c -k --sequesterRsrc --keepParent "dist/CS2 Settings.app" dist/CS2Settings-macos-intel.zip

          # DMG via hdiutil
          STAGE=$(mktemp -d)
          cp -R "dist/CS2 Settings.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "CS2 Settings" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            dist/CS2Settings-macos-intel.dmg
          rm -rf "$STAGE"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: CS2Settings-macos-intel
          path: |
            dist/CS2Settings-macos-intel.zip
            dist/CS2Settings-macos-intel.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/CS2Settings-macos-intel.zip
            dist/CS2Settings-macos-intel.dmg
          generate_release_notes: true
      - name: Upload macOS artifacts to existing release
        if: github.event_name == 'workflow_dispatch' && inputs.upload_to_release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.upload_to_release }}" \
            dist/CS2Settings-macos-intel.zip \
            dist/CS2Settings-macos-intel.dmg \
            --clobber
