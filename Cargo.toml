[package]
name = "cs2-settings"
version = "1.0.0"
edition = "2021"
description = "CS2 Settings menu clone with config export"
authors = ["xd kurbie"]
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[build-dependencies]
winresource = "0.1"

